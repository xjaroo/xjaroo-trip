    .stop-seq{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:white;font:700 12px/1 sans-serif;margin-bottom:5px}.route-marker-wrap{width:32px;height:38px;display:grid;place-items:center}.route-marker{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--green);border:2px solid white;box-shadow:0 2px 7px #0005;display:grid;place-items:center;color:white;font:700 13px/1 sans-serif}.route-marker span{transform:rotate(45deg)}.maplibregl-popup-content{font:13px/1.4 sans-serif;border-radius:10px}.map-note{position:absolute;right:12px;top:12px;z-index:5;background:#fffefa;border-radius:8px;padding:7px 10px;box-shadow:var(--shadow);font-size:12px}.route{position:relative;z-index:1;color:var(--green);font-size:13px;margin-top:8px}.current{display:flex;gap:12px;align-items:center;background:#1f6354;color:#fff;border-radius:14px;padding:13px 17px;margin:0 0 20px}.current>span{font-size:20px;color:#a8d6b3}.current small{display:block;opacity:.78}.current.away{background:#e7e9e3;color:#43514b}.stay{display:grid;grid-template-columns:98px 1fr;gap:17px;padding:19px 20px;border-top:1px solid var(--line)}.stay.active{background:#f0f6f0}.staydates{display:grid;align-content:start;justify-items:start;gap:3px;color:var(--green);font:15px Georgia,serif}.staydates span,.staydates small{font:11px/1.3 sans-serif;color:var(--muted)}.staybody{border-left:1px solid #d8e3d9;padding-left:17px}.staytitle{display:flex;justify-content:space-between}.staybody h3{font:21px Georgia,serif;margin:1px 0 5px}.staybody .eyebrow{font-size:9px}.now{font:700 9px sans-serif;border-radius:20px;background:var(--green);color:white;padding:4px 7px;vertical-align:middle;letter-spacing:.6px}.place,.notes{font-size:13px;color:#66756d;margin:5px 0}.activities{background:#f7f7f1;border-radius:10px;margin:12px 0;padding:10px 12px;font-size:12px}.activities>b{display:block;color:var(--green);margin-bottom:4px}.activity{display:grid;grid-template-columns:1fr 1.3fr auto;gap:9px;padding:6px 0;border-top:1px solid #e7e8df}.gallery{margin-top:20px;padding-bottom:15px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 20px 18px}.photos figure{margin:0}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}.photos figcaption{font-size:12px;color:var(--muted);padding-top:4px}.photos .empty{grid-column:1/-1}.timeline>.addbutton{margin:14px 20px}.comment a{color:var(--green)}.location-search{display:flex;gap:8px}.location-search input{flex:1;min-width:0}.place-results{display:grid;gap:6px;margin-top:8px}.place-result{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;text-align:left;font-size:12px;color:var(--ink)}.place-result:hover{border-color:var(--green);background:#f3f7f2}.place-result small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.place-attribution{display:block;color:var(--muted);font-size:10px;margin-top:5px}.place-message{font-size:12px;color:var(--muted);margin:6px 0}.selected-place{display:block;font-size:11px;color:var(--green);margin-top:5px}@media(max-width:560px){.stay{grid-template-columns:72px 1fr;padding:15px 12px;gap:10px}.staybody{padding-left:12px}.activity{grid-template-columns:1fr}.top-actions #editLinkBtn{display:none}.photos{grid-template-columns:repeat(2,1fr)}.mapbox{height:330px}}
    .lower{order:-1}.map-expand{position:absolute;right:13px;top:13px;z-index:500;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fffefaed;color:var(--ink);box-shadow:var(--shadow);font-size:12px}.map-panel.map-expanded{position:fixed;inset:12px;z-index:1000;padding:12px;display:flex;flex-direction:column;box-shadow:0 10px 50px #0006}.map-panel.map-expanded .mapbox{height:auto;flex:1;min-height:0}.map-panel.map-expanded .mapfoot{flex:0 0 auto}.map-open{overflow:hidden}
    .hero-dashboard{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;max-width:940px}.hero-info-card{min-width:0;padding:13px 16px;border:1px solid #d5e1d8;border-radius:14px;background:#fffefaad}.hero-info-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.hero-info-head b{font:18px Georgia,serif}.hero-info-head small{display:block;color:var(--muted);font-size:11px}.hero-info-head strong{font:22px Georgia,serif;color:var(--green);white-space:nowrap}.hero-info-sub,.hero-info-empty{font-size:11px;color:var(--muted)}.hero-info-list{max-height:85px;overflow:auto;margin-top:6px}.hero-expense{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #e7eee8;padding:4px 0;font-size:11px}.hero-expense b{white-space:nowrap}.hero-contact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:12px}.hero-contact a{color:var(--green)}.hero-questions{border-top:1px solid #dfe8e0;margin-top:7px;padding-top:6px}.hero-questions-head{display:flex;justify-content:space-between;align-items:center}.hero-questions-head b{font-size:12px}.hero-comment-list{max-height:76px;overflow:auto}.hero-comment{border-top:1px solid #e7eee8;padding:4px 0;font-size:11px}.hero-comment b{display:block}.hero-comment-list .hero-info-empty{display:block;padding:4px 0}@media(max-width:700px){.hero-dashboard{grid-template-columns:1fr}.hero-info-card{padding:12px 14px}}
    .trip-list-section{margin:22px 0}.trip-list-head h2{font:23px Georgia,serif;margin:0}.trip-list-head p{margin:3px 0 12px}.trip-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.trip-card{display:grid;gap:7px;padding:17px 19px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--ink);text-decoration:none;box-shadow:var(--shadow)}.trip-card:hover{border-color:#9cb9a7;transform:translateY(-1px)}.trip-card-title{font:20px Georgia,serif}.trip-card-action{color:var(--green);font-size:12px;font-weight:650}.pin-gate{max-width:520px;padding:22px}.pin-gate label{display:block;font-weight:650;margin-bottom:8px}.pin-row{display:flex;gap:9px;margin-bottom:10px}.pin-row input{width:150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;letter-spacing:5px;font-size:20px}.limited-view .hero-dashboard,.limited-view .gallery{display:none}

<body><div class="shell">
  <header class="topbar"><div class="brand">wayfarer<span>.</span><small>TRIPS, TOGETHER</small></div><div class="top-actions"><span class="sharelink" id="shareText"></span><button class="btn small" id="shareBtn">Family link</button><button class="btn small" id="editLinkBtn" hidden>Traveler edit link</button><button class="btn small" id="copyBtn" hidden>Copy trip</button><button class="btn small" id="htmlBtn" hidden>Save HTML</button><button class="btn primary small" id="printBtn" hidden>Save PDF</button></div></header>
  <main id="app"><section class="hero"><div class="eyebrow">Your next chapter</div><h1>Plan a trip together.</h1><div class="meta">Keep the itinerary, places to stay, and costs in one shareable place.</div><div class="hero-controls"><button class="btn primary" id="newTripBtn">Create a trip</button></div></section><div class="subtle">A private local planner with a share link for your travel group.</div></main>
</div>
<div class="modal" id="modal"><form class="dialog" id="form"><h2 id="formTitle">Create a trip</h2><div id="formFields"></div><div class="dialog-actions"><button type="button" class="btn" id="cancelBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div></form></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let data=null,appConfig={};const params=new URLSearchParams(location.search);let tripId=params.get('trip');let editKey=tripId?(localStorage.getItem('trip-edit:'+tripId)||params.get('edit')||''):'';
if(tripId&&params.has('edit')){if(editKey)localStorage.setItem('trip-edit:'+tripId,editKey);history.replaceState({},'',`/?trip=${encodeURIComponent(tripId)}`)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2600)}
async function api(url,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(editKey)headers['X-Edit-Key']=editKey;const r=await fetch(url,{...options,headers});const raw=await r.text();let body={};try{body=JSON.parse(raw)}catch{body.error=raw}if(!r.ok){const error=Error(body.error||`Request failed (${r.status})`);error.status=r.status;throw error}return body}
const isEditor=()=>data?.access==='editor';const isLimited=()=>data?.access==='public'||data?.access==='pin';const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:data.trip.currency||'AUD'}).format(Number(n||0));
const datefmt=(d,o={weekday:'short',day:'numeric',month:'short'})=>new Date(d+'T12:00:00').toLocaleDateString(undefined,o);const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function duration(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)+1}function tripShareUrl(id=tripId){const base=(appConfig.public_url||location.origin).replace(/\/$/,'');return `${base}${location.pathname}?trip=${encodeURIComponent(id)}`}
async function load(){appConfig=await api('/api/map-config');if(!tripId){await renderHome();return}const pinKey='trip-pin:'+tripId,pin=sessionStorage.getItem(pinKey)||'';try{data=await api('/api/trips/'+tripId,{headers:pin?{'X-Trip-Pin':pin}:{}});if(data.access==='pin')sessionStorage.setItem(pinKey,pin);render()}catch(error){if(error.status===401){sessionStorage.removeItem(pinKey);renderPinGate(error.message);return}throw error}}
async function renderHome(){const publicTrips=await api('/api/public/trips'),keys=Object.keys(localStorage).filter(key=>key.startsWith('trip-edit:'));const myTrips=(await Promise.all(keys.map(async key=>{const id=key.slice('trip-edit:'.length);try{const tripData=await api('/api/trips/'+encodeURIComponent(id),{headers:{'X-Edit-Key':localStorage.getItem(key)||''}});return{id,trip:tripData.trip}}catch{return null}}))).filter(Boolean);const card=(item,owned=false)=>`<a class="trip-card" href="/?trip=${encodeURIComponent(item.id)}"><span class="trip-card-title">${esc(item.trip.title)}</span><span class="subtle">${datefmt(item.trip.start_date,{day:'numeric',month:'short',year:'numeric'})} – ${datefmt(item.trip.end_date,{day:'numeric',month:'short',year:'numeric'})}</span><span class="trip-card-action">${owned?'Open your trip':'View shared trip'} →</span></a>`;$('#app').innerHTML=`<section class="hero"><div class="eyebrow">Trips, together</div><h1>Plan a trip together.</h1><div class="meta">Create a trip without an account, then choose who can see it.</div><div class="hero-controls"><button class="btn primary" id="newTripBtn">Create a trip</button></div></section>${myTrips.length?`<section class="trip-list-section"><div class="trip-list-head"><div><h2>My trips</h2><p class="subtle">Saved in this browser. Keep the traveler edit link safe.</p></div></div><div class="trip-list">${myTrips.map(item=>card(item,true)).join('')}</div></section>`:''}<section class="trip-list-section"><div class="trip-list-head"><div><h2>Explore public trips</h2><p class="subtle">Upcoming and active trips shared for everyone to view.</p></div></div><div class="trip-list">${publicTrips.map(item=>card({id:item.id,trip:item})).join('')||'<div class="empty">No public trips are currently available.</div>'}</div></section>`;$('#newTripBtn').onclick=()=>openTrip()}
function renderPinGate(message){$('#app').innerHTML=`<section class="hero"><div class="eyebrow">Private trip</div><h1>Enter the trip PIN</h1><p class="meta">This view shares the itinerary only. Contact details, costs and family comments stay private.</p></section><section class="panel pin-gate"><form id="pinForm"><label for="tripPin">Four-digit PIN</label><div class="pin-row"><input id="tripPin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" maxlength="4" required><button class="btn primary" type="submit">View trip</button></div><div class="subtle">${esc(message||'')}</div></form></section>`;$('#pinForm').onsubmit=e=>{e.preventDefault();sessionStorage.setItem('trip-pin:'+tripId,$('#tripPin').value);load()}}
function render(){const limited=isLimited();document.body.classList.toggle('limited-view',limited);const t=data.trip,shareMode=data.access==='editor'?t.share_mode:data.access,shareUrl=tripShareUrl(),today=localToday(),stops=data.items.filter(x=>!x.parent_id).sort((a,b)=>a.start_date.localeCompare(b.start_date)),todayStop=stops.find(x=>x.start_date<=today&&x.end_date>=today),route=[t.origin,...stops.map(x=>x.place||x.title),t.origin].filter(Boolean).join(' → ');$('#shareText').textContent=shareUrl;$('#shareBtn').textContent=shareMode==='public'?'Copy public link':shareMode==='pin'?'Copy PIN link':'Family link';$('#copyBtn').hidden=!isEditor();$('#editLinkBtn').hidden=!isEditor();$('#printBtn').hidden=false;$('#htmlBtn').hidden=false;$('#shareBtn').onclick=async()=>{await navigator.clipboard.writeText(shareUrl);toast(shareMode==='public'?'Public link copied':shareMode==='pin'?'PIN link copied':'Family link copied')};$('#editLinkBtn').onclick=async()=>{await navigator.clipboard.writeText(shareUrl+'&edit='+encodeURIComponent(editKey));toast('Traveler edit link copied — share only with travelers')};$('#printBtn').onclick=()=>window.print();$('#htmlBtn').onclick=downloadHtml;$('#copyBtn').onclick=async()=>{const x=await api('/api/trips/'+tripId+'/copy',{method:'POST'});localStorage.setItem('trip-edit:'+x.id,x.edit_key);location.href='/?trip='+x.id+'&edit='+x.edit_key};
 const stopHtml=stops.map((s,index)=>{const active=s.start_date<=today&&s.end_date>=today,children=data.items.filter(x=>Number(x.parent_id)===Number(s.id));return `<article class="stay ${active?'active':''}"><div class="staydates"><span class="stop-seq">${index+1}</span><b>${datefmt(s.start_date,{day:'numeric',month:'short'})}</b><span>to</span><b>${datefmt(s.end_date,{day:'numeric',month:'short'})}</b><small>${duration(s.start_date,s.end_date)} days</small></div><div class="staybody"><div class="staytitle"><div><span class="eyebrow">${esc(s.kind==='travel'?'Travel leg':s.category||'Stay')}</span><h3>${esc(s.title)} ${active?'<span class="now">TODAY</span>':''}</h3></div><div>${isEditor()?`<button class="btn ghost small" onclick="editItem(${s.id})">Edit</button><button class="btn ghost small deletebtn" onclick="removeItem(${s.id})">Remove</button>`:''}</div></div>${s.place?`<p class="place">⌖ ${esc(s.place)}</p>`:''}${s.notes?`<p class="notes">${esc(s.notes)}</p>`:''}${children.length?`<div class="activities"><b>While here</b>${children.map(a=>`<div class="activity"><span><b>${datefmt(a.start_date,{day:'numeric',month:'short'})}</b>${a.time?` · ${esc(a.time)}`:''} · ${esc(a.title)}</span><span>${a.place?esc(a.place):''}${a.notes?` — ${esc(a.notes)}`:''}</span>${isEditor()?`<button class="btn ghost small" onclick="editItem(${a.id})">Edit</button><button class="btn ghost small deletebtn" onclick="removeItem(${a.id})">×</button>`:''}</div>`).join('')}</div>`:''}${isEditor()?`<button class="btn ghost small addbutton" onclick="openItem('${s.id}','${s.end_date}')">＋ Add activity in this stop</button>`:''}</div></article>`}).join('');
 const ungrouped=data.items.filter(x=>x.parent_id&&!stops.some(s=>Number(s.id)===Number(x.parent_id)));const segments=stopHtml+(ungrouped.length?ungrouped.map(x=>`<article class="stay"><div class="staydates"><b>${datefmt(x.start_date,{day:'numeric',month:'short'})}</b><small>${duration(x.start_date,x.end_date)} day(s)</small></div><div class="staybody"><h3>${esc(x.title)}</h3><p class="place">${esc(x.place)}</p>${esc(x.notes)}</div></article>`).join(''):'');
 const total=data.expenses.reduce((s,x)=>s+Number(x.amount),0)+data.items.reduce((s,x)=>s+Number(x.cost),0);const markers=stops.map((stop,index)=>({stop,index})).filter(({stop})=>stop.latitude!==null&&stop.longitude!==null&&Number.isFinite(Number(stop.latitude))&&Number.isFinite(Number(stop.longitude)));const map='<div id="journeyMap" class="journey-map" aria-label="Map showing the trip stops and their order"></div>';
 $('#app').innerHTML=`<section class="hero"><div class="eyebrow">${duration(t.start_date,t.end_date)} days${limited?'':' · '+t.travelers+' traveling'}</div><h1>${esc(t.title)}</h1><div class="meta"><span>${datefmt(t.start_date,{day:'numeric',month:'long',year:'numeric'})}</span><span class="dot"></span><span>${datefmt(t.end_date,{day:'numeric',month:'long',year:'numeric'})}</span>${limited?'':`<span class="dot"></span><span>${esc(t.origin||'Origin not set')} ↔ return</span>`}</div><div class="route">${esc(route||'Add your home base and journey stops')}</div><div class="hero-dashboard"><section class="hero-info-card"><div class="hero-info-head"><div><b>Trip costs</b><small>${t.travelers} travelers · ${esc(t.currency)}</small></div><strong>${money(total)}</strong></div><div class="hero-info-sub">${money(total/Math.max(1,t.travelers))} per person</div><div class="hero-info-list">${data.expenses.map(x=>`<div class="hero-expense"><span>${esc(x.description)} · ${esc(x.category)} ${isEditor()?`<button class="btn ghost small deletebtn" onclick="removeExpense(${x.id})">×</button>`:''}</span><b>${money(x.amount)}</b></div>`).join('')}${data.items.filter(x=>Number(x.cost)>0).map(x=>`<div class="hero-expense"><span>${esc(x.title)} · ${x.parent_id?'activity':'stop'}</span><b>${money(x.cost)}</b></div>`).join('')}</div>${!data.expenses.length&&!data.items.some(x=>Number(x.cost)>0)?'<div class="hero-info-empty">Add lodging, transport, and activity costs.</div>':''}</section><section class="hero-info-card"><div class="hero-info-head"><b>Home contacts</b></div>${t.emergency_name?`<div class="hero-contact"><strong>${esc(t.emergency_name)}</strong><a href="tel:${esc(t.emergency_phone)}">${esc(t.emergency_phone)}</a></div>`:'<div class="hero-info-empty">No emergency contact added.</div>'}<div class="hero-questions"><div class="hero-questions-head"><b>Questions & notes</b><button class="btn ghost small" onclick="openComment()">＋ Add comment</button></div><div class="hero-comment-list">$ </a> · <a href="https://openmaptiles.org/" target="_blank" rel="noreferrer">OpenMapTiles</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> · <a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noreferrer">Report a map issue</a></span></div></section></div></div><section class="panel gallery"><div class="panel-head"><div><h2>Trip memories</h2><div class="subtle">Small, compressed photos shared with the group</div></div>${isEditor()?'<label class="btn small">＋ Add photo<input id="photoInput" type="file" accept="image/*" hidden></label>':''}</div><div class="photos">${data.photos.map(p=>`<figure><img src="${esc(p.url)}" alt="${esc(p.caption)}"><figcaption>${esc(p.caption)}</figcaption></figure>`).join('')||'<div class="empty">Photos added by the travelers will appear here.</div>'}</div></section>`;

async function drawJourneyMap(stops){
 const container=$('#journeyMap');if(!container)return;
 const mapped=stops.map((stop,index)=>({stop,index,lat:Number(stop.latitude),lon:Number(stop.longitude)})).filter(x=>x.stop.latitude!==null&&x.stop.longitude!==null&&Number.isFinite(x.lat)&&Number.isFinite(x.lon));
 try{
  const maplibregl=await import('https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.mjs');
  const {Map,Marker,Popup,NavigationControl}=maplibregl;
  const styleResponse=await fetch(appConfig.style_url);if(!styleResponse.ok)throw new Error(`Map style returned HTTP ${styleResponse.status}`);
  const style=await styleResponse.json();
  for(const layer of style.layers||[]){
   if(layer.type!=='symbol'||!layer.layout?.['text-field'])continue;
   if(!JSON.stringify(layer.layout['text-field']).includes('name'))continue;
   layer.layout['text-field']=['coalesce',['get','name:en'],['get','name_en'],['get','name:latin'],['get','name']];
  }
  const map=new Map({container,style,center:mapped.length?[mapped[0].lon,mapped[0].lat]:[115.86,-31.95],zoom:mapped.length===1?10:4,scrollZoom:false,attributionControl:{compact:false}});window.tripMap=map;
  map.addControl(new NavigationControl({showCompass:false}),'top-left');
  if(mapped.length>1){
   map.on('load',()=>{
    const coordinates=mapped.map(x=>[x.lon,x.lat]);
    map.addSource('journey-route',{type:'geojson',data:{type:'Feature',properties:{},geometry:{type:'LineString',coordinates}}});
    map.addLayer({id:'journey-route-line',type:'line',source:'journey-route',paint:{'line-color':'#1f6354','line-width':4,'line-opacity':.8,'line-dasharray':[2,2]}});
    const bounds=coordinates.reduce((result,point)=>result.extend(point),new maplibregl.LngLatBounds());map.fitBounds(bounds,{padding:40,maxZoom:10});
   });
  }
  mapped.forEach(({stop,index,lat,lon})=>{
   const element=document.createElement('div');element.className='route-marker-wrap';element.innerHTML=`<div class="route-marker"><span>${index+1}</span></div>`;
   const popup=`<strong>${index+1}. ${esc(stop.title)}</strong><br>${esc(stop.category||'Stop')}<br>${esc(stop.place||'')}<br>${datefmt(stop.start_date)}–${datefmt(stop.end_date)}${stop.notes?`<hr><div>${esc(stop.notes)}</div>`:''}${Number(stop.cost)>0?`<br>${money(stop.cost)}`:''}`;
   new Marker({element,anchor:'bottom'}).setLngLat([lon,lat]).setPopup(new Popup({offset:24}).setHTML(popup)).addTo(map);
  });
  if(!mapped.length){const note=document.createElement('div');note.className='map-note';note.textContent='Add a place to show the route';container.append(note)}
 }catch(error){container.textContent=`Map could not be loaded: ${error.message}`}
}
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('#journeyMapPanel')?.classList.contains('map-expanded'))toggleMapFullscreen()});
function toggleMapFullscreen(){const panel=$('#journeyMapPanel');if(!panel)return;const expanded=panel.classList.toggle('map-expanded');document.body.classList.toggle('map-open',expanded);const button=$('#mapExpandBtn');if(button){button.textContent=expanded?'⛶ Exit map':'⛶ Expand map';button.setAttribute('aria-label',expanded?'Exit expanded map':'Expand map')}requestAnimationFrame(()=>window.tripMap?.resize())}
function open(fields,title,submit){$('#formTitle').textContent=title;$('#formFields').innerHTML=fields;$('#modal').classList.add('open');$('#form').onsubmit=async e=>{e.preventDefault();try{await submit(new FormData(e.currentTarget));$('#modal').classList.remove('open');await load()}catch(x){toast(x.message)}}}
function inp(label,name,type='text',value='',attrs=''){const required=attrs.includes('optional')?'':'required';attrs=attrs.replace('optional','');return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${attrs} ${required}></div>`}
function openTrip(){const t=data?.trip||{},mode=t.share_mode||'private';const sharing=`<div class="field wide"><label for="shareMode">Sharing</label><select id="shareMode" name="share_mode"><option value="private" ${mode==='private'?'selected':''}>Unlisted family link</option><option value="pin" ${mode==='pin'?'selected':''}>Private link with four-digit PIN</option><option value="public" ${mode==='public'?'selected':''}>Public listing</option></select><small class="subtle">Public and PIN views omit contacts, traveler names, costs, notes, family comments, and photos.</small></div><div class="field wide"><label for="tripPin">Four-digit PIN</label><input id="tripPin" name="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="4" pattern="[0-9]{4}"><small id="pinHelp" class="subtle">Required for PIN-protected sharing; leave blank for other modes.</small></div>`;open(`<div class="fields">${inp('Trip name','title','text',t.title||'')}${inp('Travelers','travelers','number',t.travelers||1,'min="1"')}${inp('Trip start','start_date','date',t.start_date||'')}${inp('Trip end / home arrival','end_date','date',t.end_date||'')}${inp('Starting from / home base','origin','text',t.origin||'Perth, Western Australia')}${inp('Travelers’ names','traveler_names','text',t.traveler_names||'','optional')}${inp('Emergency contact at home','emergency_name','text',t.emergency_name||'','optional')}${inp('Contact phone','emergency_phone','tel',t.emergency_phone||'','optional')}${inp('Currency','currency','text',t.currency||'AUD','maxlength="3"')}${sharing}</div>`,data?'Edit trip':'Create a trip',async f=>{const body=Object.fromEntries(f);body.travelers=Number(body.travelers);if(data)await api('/api/trips/'+tripId,{method:'PATCH',body:JSON.stringify(body)});else{const x=await api('/api/trips',{method:'POST',body:JSON.stringify(body)});localStorage.setItem('trip-edit:'+x.id,x.edit_key);location.href='/?trip='+x.id+'&edit='+x.edit_key}});const pinInput=$('#tripPin');const u function openItem(parentId=null,end='',item=null){
 const parent=parentId?data.items.find(x=>Number(x.id)===Number(parentId)):null,activity=Boolean(item?.parent_id||parent),start=item?.start_date||parent?.start_date||data.trip.start_date,finish=item?.end_date||parent?.end_date||end||start;
 const fields=activity?`${inp('Activity date','start_date','date',start)}${inp('Time','time','time',item?.time||'','optional')}${inp('Activity','title','text',item?.title||'')}<input type="hidden" name="end_date" value="${item?.end_date||''}"><input type="hidden" name="parent_id" value="${item?.parent_id||parentId||''}"><input type="hidden" name="kind" value="activity">`:`${inp('Stop / travel leg','title','text',item?.title||'')}${inp('Type (stay, visit, flight...)','category','text',item?.category||'Accommodation')}${inp('Start date','start_date','date',start)}${inp('End date','end_date','date',finish)}<input type="hidden" name="kind" value="${item?.kind||'stop'}">`;
 open(`<div class="fields">${fields}<div class="field wide"><label for="placeSearch">Search for a place</label><div class="location-search"><input id="placeSearch" type="search" value="${esc(item?.place||'')}" placeholder="e.g. Hotel name, station, city or attraction"><button class="btn small" type="button" id="searchPlaces">Search</button></div><input type="hidden" name="place" id="placeValue" value="${esc(item?.place||'')}"><input type="hidden" name="latitude" id="placeLatitude" value="${item?.latitude??''}"><input type="hidden" name="longitude" id="placeLongitude" value="${item?.longitude??''}"><div id="placeResults" class="place-results"></div><small class="place-attribution">Results show English and the original/local name when the map has one. Searches go to OpenStreetMap. © OpenStreetMap contributors · Search by Nominatim</small></div>${inp('Estimated cost','cost','number',item?.cost??0,'min="0" step="0.01" optional')}<div class="field wide"><label>Notes</label><textarea name="notes" placeholder="Address, check-in details, family updates...">${esc(item?.notes||'')}</textarea></div></div>`,item?(activity?'Edit activity':'Edit journey stop'):(activity?'Add activity':'Add journey stop'),async f=>{const body=Object.fromEntries(f);for(const k of ['cost','latitude','longitude','parent_id'])body[k]=body[k]?Number(body[k]):null;body.clear_coordinates=Boolean(item&&(!body.latitude||!body.longitude));if(activity)body.end_date=body.start_date;else body.end_date=body.end_date||body.start_date;await api(item?`/api/trips/${tripId}/items/${item.id}`:`/api/trips/${tripId}/items`,{method:item?'PATCH':'POST',body:JSON.stringify(body)})});
 wirePlaceSearch();
}
function editItem(id){const item=data.items.find(x=>Number(x.id)===Number(id));if(item)openItem(null,'',item)}
function wirePlaceSearch(){const input=$('#placeSearch'),results=$('#placeResults'),place=$('#placeValue'),latitude=$('#placeLatitude'),longitude=$('#placeLongitude');let lastRequest=0;input.addEventListener('input',()=>{place.value=input.value;latitude.value='';longitude.value=''});input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();$('#searchPlaces').click()}});$('#searchPlaces').onclick=async()=>{const q=input.value.trim();if(q.length<3){results.innerHTML='<div class="place-message">Enter at least three characters.</div>';return}const wait=1100-(Date.now()-lastRequest);if(wait>0){results.innerHTML='<div class="place-message">Please wait a moment before searching again.</div>';return}lastRequest=Date.now();results.innerHTML='<div class="place-message">Searching places…</div>';try{const found=await api('/api/places?q='+encodeURIComponent(q));results.innerHTML=found.length?found.map((p,i)=>{const local=p.namedetails?.name||'',hasLocal=local&&local.toLocaleLowerCase()!==p.display_name.toLocaleLowerCase();return `<button type="button" class="place-result" data-place-index="${i}"><span>English: ${esc(p.display_name)}</span>${hasLocal?`<small>Local name: ${esc(local)}</small>`:''}</button>`}).join(''):'<div class="place-message">No matches. Try a nearby landmark or suburb.</div>';[...results.querySelectorAll('[data-place-index]')].forEach(button=>button.onclick=()=>{const p=found[Number(button.dataset.placeIndex)],local=p.namedetails?.name||'',hasLocal=local&&local.toLocaleLowerCase()!==p.display_name.toLocaleLowerCase();input.value=p.display_name;place.value=p.display_name+(hasLocal?` (${local})`:'');latitude.value=Number(p.lat);longitude.value=Number(p.lon);results.innerHTML=`<span class="selected-place">Pinned: ${esc(p.display_name)}${hasLocal?` · ${esc(local)}`:''}</span>`})}catch(error){results.innerHTML=`<div class="place-message">${esc(error.message)}</div>`}}}

function openExpense(){open(`<div class="fields">${inp('What is it for?','description')}${inp('Amount','amount','number','','min="0" step="0.01"')}${inp('Category','category','text','Accommodation')}</div>`,'Add a trip cost',async f=>{let body=Object.fromEntries(f);body.amount=Number(body.amount);await api('/api/trips/'+tripId+'/expenses',{method:'POST',body:JSON.stringify(body)})})}
async function removeItem(id){if(confirm('Remove this stop or activity?')){await api(`/api/trips/${tripId}/items/${id}`,{method:'DELETE'});load()}}async function removeExpense(id){if(confirm('Remove this cost?')){await api(`/api/trips/${tripId}/expenses/${id}`,{method:'DELETE'});load()}}
async function uploadPhoto(e){const file=e.target.files[0];if(!file)return;try{const img=await createImageBitmap(file),scale=Math.min(1,1400/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const dataUrl=canvas.toDataURL('image/jpeg',.72),caption=prompt('Add a short caption (optional)')||'';await api('/api/trips/'+tripId+'/photos',{method:'POST',body:JSON.stringify({data_url:dataUrl,caption})});await load();toast('Photo added')}catch(err){toast(err.message||'Could not add photo')}}
async function downloadHtml(){const copy=document.documentElement.cloneNode(true);copy.querySelectorAll('script,.modal,.toast,.top-actions').forEach(x=>x.remove());await Promise.all([...copy.querySelectorAll('.photos img')].map(async img=>{try{const response=await fetch(img.src),blob=await response.blob();img.src=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob)})}catch{}}));const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.trip.title||'trip').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.html';a.click();URL.revokeObjectURL(a.href)}
